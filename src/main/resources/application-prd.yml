server:
  port: 8080
  servlet:
    context-path: /api  # 全局接口前缀
spring:
  data:
    redis:
      host: 192.168.1.100
      port: 6379
      password: "你的生产密码"
      database: 1
      connect-timeout: 10s
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 2
          max-wait: -1ms

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: SJNreZr6rxyT
    hikari:
      pool-name: pgsql-pool
      minimum-idle: 2
      maximum-pool-size: 16
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 线上也打印 SQL，方便排错（你要求的）
logging:
  level:
    com.inventory.mapper: debug
    org.mybatis: debug
    org.springframework.jdbc: debug