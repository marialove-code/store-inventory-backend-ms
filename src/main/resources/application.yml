# ==============================
# 激活环境
# dev  = 本地开发
# uat = 测试
# prod = 线上服务器
# ==============================
spring:
  profiles:
    active: prd
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
# ==============================
# 公共配置（所有环境共用）
# ==============================
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: "null"

knife4j:
  enable: true

jwt:
  # 1. JWT 签名密钥（核心！用于加密签名，防止Token被篡改，必须32位以上复杂字符串）
  secret: 8fA#2kLmPq9XvR7nTz5@Bc1YhU6WsQ0D
  # 2. 访问令牌过期时间（单位：分钟）→ 用于正常接口鉴权，有效期短更安全
  access-expire: 120
  # 3. 刷新令牌过期时间（单位：分钟）→ 用于AccessToken过期后无感刷新，10080 = 7天
  refresh-expire: 10080
  # 4. 前端传递Token时使用的请求头Key（标准名称：Authorization）
  header: Authorization
  # 5. Token前缀（标准格式：Bearer 空格）→ 属于HTTP认证规范格式
  token-prefix: Bearer

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

