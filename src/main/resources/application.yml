# ==============================
# 激活环境
# dev  = 本地开发
# uat = 测试
# prod = 线上服务器
# ==============================
spring:
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Spring AI（通义千问 DashScope · OpenAI 兼容模式）
  # API Key 请配置环境变量 DASHSCOPE_API_KEY，勿写入仓库
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-turbo
          temperature: 0.3
# ==============================
# 公共配置（所有环境共用）
# ==============================
app:
  version: v2.0.0

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: "null"
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true

jwt:
  # 1. JWT 签名密钥（核心！用于加密签名，防止Token被篡改，必须32位以上复杂字符串）
  secret: 8fA#2kLmPq9XvR7nTz5@Bc1YhU6WsQ0D
  # 2. 访问令牌过期时间（单位：分钟）→ 用于正常接口鉴权，有效期短更安全
  access-expire: 120
  # 3. 刷新令牌过期时间（单位：分钟）→ 用于AccessToken过期后无感刷新，10080 = 7天
  refresh-expire: 10080
  # 4. 前端传递Token时使用的请求头Key（标准名称：Authorization）
  header: Authorization
  # 5. Token前缀（标准格式：Bearer 空格）→ 属于HTTP认证规范格式
  token-prefix: Bearer

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ==============================
# 业务侧 AI 配置（会话长度、降级话术等）
# ==============================
inventory:
  ai:
    chat:
      max-history-messages: 20
      fallback-reply: 抱歉，智能客服暂时繁忙，请稍后再试。您也可以点击上方快捷问题，或联系管理员。
      # 会话存储：memory（默认 JVM）| redis（学习对比用，见 RedisChatSessionStore）
      session-store: memory
      # Redis 会话 TTL（秒），7 天 = 604800
      session-ttl-seconds: 604800
    # AI SQL 助手：只读查询安全边界
    sql:
      max-rows: 100
      allowed-tables:
        - goods_product
        - goods_category
        - goods_brand
        - inventory_stock
        - inventory_flow
        - inventory_in
        - inventory_out
        - order_info
        - order_delivery
        - order_refund
        - sys_user
        - sys_role
        - sys_operation_log

