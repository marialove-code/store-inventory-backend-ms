server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: order-service
  datasource:
    # 与库存服务、单体共用同一 PostgreSQL，便于渐进拆分时数据一致
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: ${DB_PWD:}
    driver-class-name: org.postgresql.Driver

# MyBatis-Plus：扫描 mapper XML、下划线转驼峰、雪花主键
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

# 库存服务地址（不含具体路径；客户端再拼 /inventory/internal/**）
# 完整示例：http://localhost:8082/api + /inventory/internal/lock
inventory:
  service:
    base-url: http://localhost:8082/api

logging:
  level:
    root: INFO
    com.inventory.order: INFO
    com.inventory.modules.order: INFO
