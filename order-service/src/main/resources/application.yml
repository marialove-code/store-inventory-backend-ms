# ==============================
# order-service · 公共配置
# ==============================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: order-service
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        prefer-ip-address: true
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        file-extension: yaml
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
  config:
    import:
      - optional:nacos:order-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: ${DB_PWD}
  # 并发 V5 分布式锁；与 platform 共用同一 Redis（靠 Key 前缀隔离）
  # host/password 由环境变量或 application-dev/prd 覆盖
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 无密码时不要写 password（空串会导致 Redisson 误发 AUTH）
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms
  # 并发 V6：本机 Docker 起的 RabbitMQ（docker run rabbitmq:3-management）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PWD:guest}
    # 发布确认 / 消费者手动 ack 等高级项留给后续；先保证能连通

server:
  port: 8083
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  nacos-demo-message: local-default
  # 并发 V5 / V5r / V6 / V7
  concurrency:
    v5:
      lock-wait-ms: 30000
      # 手写版固定租约（秒）
      lock-lease-seconds: 30
    v5r:
      # Redisson：-1=看门狗自动续期；>0=固定租约秒数
      lock-lease-seconds: -1
    v6:
      # 与 RabbitMqConfig 中队列名保持一致（仅文档/日志可读，代码用常量）
      lock-stock-queue: order.concurrency.lock.stock
    v7:
      # 幂等键 Redis TTL（小时）
      idempotent-ttl-hours: 24
      # 补偿任务扫描间隔（毫秒）
      compensate-delay-ms: 30000
  sentinel:
    order-ping-flow-enabled: true
    order-unstable-degrade-enabled: true
    order-business-flow-enabled: true
    order-create-qps: 20
    order-cancel-qps: 20
    inventory-degrade-enabled: true

logging:
  level:
    root: INFO
    com.inventory.order: INFO
    com.inventory.modules.order: INFO
    com.alibaba.cloud.nacos: INFO
