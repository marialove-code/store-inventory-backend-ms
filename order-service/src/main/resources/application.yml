server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    # 注册到 Nacos 时的服务名
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        prefer-ip-address: true
  # 默认激活 dev，以便加载 concurrency 压测 Controller（@Profile("dev")）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 与库存服务、单体共用同一 PostgreSQL，便于渐进拆分时数据一致
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: ${DB_PWD:}
    driver-class-name: org.postgresql.Driver

# MyBatis-Plus：扫描 mapper XML、下划线转驼峰、雪花主键
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

# 库存调用已改为 Feign：按服务名 inventory-service 从 Nacos 发现，不再配置 base-url

logging:
  level:
    root: INFO
    com.inventory.order: INFO
    com.inventory.modules.order: INFO
