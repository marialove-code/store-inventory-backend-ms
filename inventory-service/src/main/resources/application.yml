server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    # 注册到 Nacos 时的服务名
    name: inventory-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        prefer-ip-address: true
  datasource:
    # 与单体共用同一 PostgreSQL，便于渐进拆分时数据一致
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: ${DB_PWD:}
    driver-class-name: org.postgresql.Driver

# MyBatis-Plus：扫描 mapper XML、下划线转驼峰、雪花主键
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

logging:
  level:
    root: INFO
    com.inventory.stock: INFO
    com.inventory.modules.invertory: INFO
