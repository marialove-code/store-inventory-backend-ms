version: "1.0"
name: order-cd
displayName: Order-CD部署
stages:
- name: 编译order
  displayName: 编译order
  strategy: fast
  trigger: auto
  steps:
  - step: build@maven
    name: build_order
    displayName: Maven打包order
    jdkVersion: "17"
    mavenVersion: 3.6.3
    commands:
    - mvn -B -pl order-service -am -DskipTests package
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./order-service/target/order-service-3.6.0.jar
      type: .tar.gz
- name: 部署到服务器
  displayName: 部署到服务器
  strategy: fast
  trigger: manual
  steps:
  - step: deploy@agent
    name: deploy_order_host
    displayName: 主机部署order容器
    deployArtifact:
    - name: order-service-360-jar
      target: /www/wwwroot/inventory-ms-backend/deploy/order-runtime
      source: build
      dependArtifact: BUILD_ARTIFACT
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |-
      set -e
      MS_HOME=/www/wwwroot/inventory-ms-backend
      RUNTIME=$MS_HOME/deploy/order-runtime
      DEST_JAR=$RUNTIME/order-service-3.6.0.jar
      DEPLOY_NAME=order-service-360-jar

      echo "==== CD 主机部署开始 ===="
      echo "RUNTIME=$RUNTIME"
      ls -la "$RUNTIME" || true

      # 1) Gitee 下发的无点号文件 → Dockerfile 需要的正式 jar 名
      if [ -f "$RUNTIME/$DEPLOY_NAME" ]; then
        cp -f "$RUNTIME/$DEPLOY_NAME" "$DEST_JAR"
        echo "已从 $DEPLOY_NAME 生成 $DEST_JAR"
      elif [ -f "$DEST_JAR" ]; then
        echo "已存在正式 jar：$DEST_JAR"
      else
        FOUND=$(find "$RUNTIME" -type f \( -name "$DEPLOY_NAME" -o -name 'order-service-3.6.0.jar' -o -name '*.jar' \) 2>/dev/null | head -n 1 || true)
        if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
          cp -f "$FOUND" "$DEST_JAR"
          echo "已从 $FOUND 生成 $DEST_JAR"
        else
          echo "错误：未找到部署产物，目录内容："
          ls -laR "$RUNTIME" || true
          exit 1
        fi
      fi

      # 2) 检查部署脚本
      DEPLOY_SH=$MS_HOME/scripts/deploy-order-docker.sh
      if [ ! -f "$DEPLOY_SH" ]; then
        echo "错误：找不到 $DEPLOY_SH ，请先上传部署脚本"
        exit 1
      fi
      chmod +x "$DEPLOY_SH"

      # 3) 换 jar、重建容器、探活
      bash "$DEPLOY_SH" "$DEST_JAR"
      echo "==== CD 主机部署结束 ===="
    hostGroupID:
      ID: inventory-prd
      hostID:
      - 9a637d93-b590-4344-a392-0f3c38d415f1
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    tags:
      prefix:
      - order-v
      precise: []
      include: []
notify: []
variables:
  DEPLOY_NOTE: 请将下方 hostGroupID 改为你的主机组 ID
