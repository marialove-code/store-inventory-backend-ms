# platform-service · 本地开发（对齐单体 application-dev.yml）
spring:
  cloud:
    nacos:
      discovery:
        # 本机多网卡时强制环回，避免网关 lb 打到不可达虚拟网卡 IP
        ip: 127.0.0.1
  data:
    redis:
      # 默认直连服务器公网 Redis（当前无密码）；隧道场景可设 REDIS_HOST=127.0.0.1
      host: ${REDIS_HOST:120.53.88.204}
      port: ${REDIS_PORT:6379}
      # 无密码时不要写 password 键（空串可能触发 AUTH）；有密码时取消下一行注释
      # password: ${REDIS_PWD}
  datasource:
    password: ${DB_PWD}
  # P4：本机 Elasticsearch（Docker 容器 es-dev:9200）
  elasticsearch:
    uris: ${ES_URIS:http://127.0.0.1:9200}

app:
  cors:
    allowed-origins: http://localhost:5173
  upload:
    avatar-path: E:/Image/upload/avatar/
    product-image-path: E:/Image/upload/product/
    product-image-prefix: /upload/product/
    brand-image-path: E:/Image/upload/brand/
    brand-image-prefix: /upload/brand/
  elasticsearch:
    # true 时装配 GoodsEsSearchService / Controller；ES 未启动时请先 docker start es-dev
    enabled: true
    reindex-limit: 500

logging:
  level:
    com.inventory: debug
