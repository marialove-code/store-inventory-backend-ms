# ==============================
# platform-service（P4）配置
# 端口 8081；与单体共用同一 PostgreSQL / Redis，便于渐进拆分
# ==============================
server:
  port: 8081
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    # 注册到 Nacos 时的服务名（其他服务将来按此名字发现本服务）
    name: platform-service
  cloud:
    nacos:
      discovery:
        # 本机 Nacos 地址；未开鉴权时不必配 username/password
        server-addr: 127.0.0.1:8848
        # 控制台「服务列表」里更易看到本机 IP
        prefer-ip-address: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # PostgreSQL（与单体 / 库存 / 订单同库）
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: ${DB_PWD:}
  # Redis（host/password 建议走环境变量，勿把生产密码写入仓库）
  data:
    redis:
      host: ${REDIS_HOST:120.53.88.204}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms
      shutdown-timeout: 100ms
      ssl:
        enabled: false

# JWT：与单体对齐；生产务必用环境变量 JWT_SECRET 覆盖默认值
jwt:
  # 本地联调默认值与单体相同；部署环境请设置 JWT_SECRET
  secret: ${JWT_SECRET:8fA#2kLmPq9XvR7nTz5@Bc1YhU6WsQ0D}
  access-expire: 120
  refresh-expire: 10080
  header: Authorization
  token-prefix: Bearer

# 跨域与上传（对齐单体 application-dev.yml）
app:
  version: v3.0.0
  cors:
    allowed-origins: http://localhost:5173
  upload:
    avatar-path: E:/Image/upload/avatar/
    product-image-path: E:/Image/upload/product/
    product-image-prefix: /upload/product/
    brand-image-path: E:/Image/upload/brand/
    brand-image-prefix: /upload/brand/

# 库存调用已改为 Feign：按服务名 inventory-service 从 Nacos 发现，不再配置 base-url

# MyBatis-Plus（含逻辑删除，与单体一致）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    jdbc-type-for-null: "null"
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.inventory: INFO
