# =============================================================================
# 单体项目 Nginx 配置存档（切换微服务前备份）
# 域名：nestparts.top / www.nestparts.top
# 前端：/www/wwwroot/inventory-front
# 后端：本机 8080（单体 Spring Boot）
# 备份日期：按你实际切换日自行备注
# =============================================================================
# 说明图例：
#   [有用]     — 微服务切换后通常仍要保留的思路
#   [需改]     — 逻辑有用，但切微服务后要改路径/端口
#   [单体专用] — 只服务旧单体，切微服务后应改掉
# =============================================================================

user www www;
worker_processes auto;
error_log  /www/wwwlogs/nginx_error.log crit;
pid        /www/server/nginx/logs/nginx.pid;
worker_rlimit_nofile 51200;

events {
    # [有用] Linux 下用 epoll，高并发连接模型
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http {
    include       mime.types;
    # [有用] 宝塔/OpenResty 常见 Lua 路径；本站配置没用到 Lua，可保留不动
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    # [有用] 上传体积上限（全站）
    client_max_body_size 50m;

    # [有用] gzip：减小 JS/CSS 传输体积
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;
    gzip_vary on;

    # ==========================================
    # 1. HTTP 80 → 强制跳 HTTPS www
    # [有用] 统一入口，避免 http/https、裸域/www 混用
    # ==========================================
    server {
        listen 80;
        server_name nestparts.top www.nestparts.top;
        return 301 https://www.nestparts.top$request_uri;
    }

    # ==========================================
    # 2. 裸域名 HTTPS → 跳 www
    # [有用] 证书仍挂在 nestparts.top 上，只做跳转
    # ==========================================
    server {
        listen 443 ssl;
        server_name nestparts.top;

        ssl_certificate     /www/server/panel/vhost/cert/nestparts.top/fullchain.pem;
        ssl_certificate_key /www/server/panel/vhost/cert/nestparts.top/privkey.pem;

        return 301 https://www.nestparts.top$request_uri;
    }

    # ==========================================
    # 3. 正式站点（www.nestparts.top）
    # ==========================================
    server {
        listen 443 ssl;
        server_name www.nestparts.top;

        # [需改] 单体前端目录；微服务应改为 inventory-ms-front
        root /www/wwwroot/inventory-front;
        index index.html;

        # [有用] SSL 证书路径（宝塔申请后生成，微服务继续用同一套即可）
        ssl_certificate     /www/server/panel/vhost/cert/nestparts.top/fullchain.pem;
        ssl_certificate_key /www/server/panel/vhost/cert/nestparts.top/privkey.pem;

        # [有用] TLS 协议与加密套件
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # [需改/可选] 单体：Nginx 直接读磁盘 /opt/upload/
        # 微服务也可继续这样（更快），或改成反代到 Gateway→platform
        # 只要最终 URL 仍是 https://www.nestparts.top/upload/... 即可
        location ^~ /upload/ {
            alias /opt/upload/;
            expires 7d;
            access_log off;
        }

        # [单体专用] API 反代到单体 8080
        # 微服务必须改成 Gateway 9080，且建议写成 location /api/ 更清晰
        location /api {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 升级头：单体若没用 WS，实际几乎不生效，保留无害
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # [有用] SPA：前端路由刷新不 404
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
