# =============================================================================
# 微服务 Nginx 配置（替换单体版使用）
# 域名：nestparts.top / www.nestparts.top（入口仍统一到 www）
# 前端：/www/wwwroot/inventory-ms-front
# API：本机 Gateway 9080（再由 Gateway 转发各微服务）
#
# 部署方式（二选一）：
#   A. 宝塔 → 网站 → nestparts.top → 配置文件：只替换「正式站点 server」那一段
#      （全局 http{} / gzip / 跳转 server 可不动）
#   B. 若你整份 nginx.conf 就是上面那份单体全文，可整份换成本文件后重载
# =============================================================================

user www www;
worker_processes auto;
error_log  /www/wwwlogs/nginx_error.log crit;
pid        /www/server/nginx/logs/nginx.pid;
worker_rlimit_nofile 51200;

events {
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http {
    include       mime.types;
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;
    gzip_vary on;

    # ------------------------------------------
    # 1. HTTP → HTTPS www（与单体相同，保留）
    # ------------------------------------------
    server {
        listen 80;
        server_name nestparts.top www.nestparts.top;
        return 301 https://www.nestparts.top$request_uri;
    }

    # ------------------------------------------
    # 2. 裸域 HTTPS → www（与单体相同，保留）
    # ------------------------------------------
    server {
        listen 443 ssl;
        server_name nestparts.top;

        ssl_certificate     /www/server/panel/vhost/cert/nestparts.top/fullchain.pem;
        ssl_certificate_key /www/server/panel/vhost/cert/nestparts.top/privkey.pem;

        return 301 https://www.nestparts.top$request_uri;
    }

    # ------------------------------------------
    # 3. 正式站点 → 微服务前端 + Gateway
    # ------------------------------------------
    server {
        listen 443 ssl;
        server_name www.nestparts.top;

        # 【改点1】前端根目录：单体 inventory-front → 微服务 inventory-ms-front
        root /www/wwwroot/inventory-ms-front;
        index index.html;

        ssl_certificate     /www/server/panel/vhost/cert/nestparts.top/fullchain.pem;
        ssl_certificate_key /www/server/panel/vhost/cert/nestparts.top/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 【推荐保留】上传文件仍由 Nginx 直接读磁盘（与单体一致、更快）
        # platform 写入 /opt/upload/，浏览器访问 https://www.nestparts.top/upload/...
        # 若以后想全部经 Gateway，可改成 proxy_pass http://127.0.0.1:9080;
        location ^~ /upload/ {
            alias /opt/upload/;
            expires 7d;
            access_log off;
        }

        # 【改点2】API：8080 单体 → 9080 Gateway
        # 前端生产环境 VITE_API_BASE_URL=/api，浏览器只打同源 /api/*
        location /api/ {
            proxy_pass http://127.0.0.1:9080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # AI/长接口可适当加长；一般业务 120s 足够
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
        }

        # 兼容偶发写成 /api（无尾斜杠）的请求
        location = /api {
            return 301 /api/;
        }

        # SPA 前端路由
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
