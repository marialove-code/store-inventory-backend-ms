# ==============================
# ai-service · 公共配置
# ==============================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        prefer-ip-address: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: ${DB_PWD:}
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-turbo
          temperature: 0.3
      # 智搜 V2：文本向量（维度须与表 goods_search_embedding.embedding vector(1024) 一致）
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024

server:
  port: 8084
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

inventory:
  ai:
    chat:
      max-history-messages: 20
      fallback-reply: 抱歉，智能客服暂时繁忙，请稍后再试。您也可以点击上方快捷问题，或联系管理员。
      session-store: memory
      session-ttl-seconds: 604800
    # 智搜 V2：语义检索（Embedding + pgvector）+ RAG 生成
    semantic:
      enabled: true
      embedding-dimensions: 1024
      reindex-limit: 200
      top-k: 5
      # true：检索后用 Chat 根据命中原文生成推荐说明
      rag-enabled: true
    sql:
      max-rows: 100
      allowed-tables:
        - goods_product
        - goods_category
        - goods_brand
        - inventory_stock
        - inventory_flow
        - inventory_in
        - inventory_out
        - order_info
        - order_delivery
        - order_refund
        - sys_user
        - sys_role
        - sys_operation_log
        - goods_search_embedding

logging:
  level:
    root: INFO
    com.inventory.ai: INFO
    com.inventory.modules.ai: INFO
