server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/inventory_store
    username: inventory_user
    password: ${DB_PWD:}
    driver-class-name: org.postgresql.Driver
  # Spring AI（通义千问 DashScope · OpenAI 兼容）
  # API Key 用环境变量 DASHSCOPE_API_KEY，勿写入仓库
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-turbo
          temperature: 0.3

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

# 业务侧 AI 配置（与单体对齐）
inventory:
  ai:
    chat:
      max-history-messages: 20
      fallback-reply: 抱歉，智能客服暂时繁忙，请稍后再试。您也可以点击上方快捷问题，或联系管理员。
      session-store: memory
      session-ttl-seconds: 604800
    sql:
      max-rows: 100
      allowed-tables:
        - goods_product
        - goods_category
        - goods_brand
        - inventory_stock
        - inventory_flow
        - inventory_in
        - inventory_out
        - order_info
        - order_delivery
        - order_refund
        - sys_user
        - sys_role
        - sys_operation_log

logging:
  level:
    root: INFO
    com.inventory.ai: INFO
    com.inventory.modules.ai: INFO
